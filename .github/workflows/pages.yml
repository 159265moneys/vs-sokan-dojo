name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Verify game rules and lessons
        run: npm test
      - name: Verify the bundled Rapfi engine
        run: node tests/engine-smoke.mjs
      - name: Verify the shortest teaching sequence
        run: python3 tests/shortest.py
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload static game
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
