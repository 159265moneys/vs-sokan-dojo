<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#101411" />
    <title>VS ソカン — 五目道場</title>
    <meta
      name="description"
      content="一手を研ぎ澄ませ。禁手なしの五目並べ、Rapfiとの対局、戦術の反復と棋譜検討。"
    />
    <link rel="icon" href="assets/crest.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="game-ui.css" />
  </head>
  <body class="mobile-game" data-mode="play">
    <div class="shell">
      <aside class="rail">
        <a href="#play" class="brand" aria-label="五目道場 ホーム"
          ><img src="assets/crest.svg" alt="" /><span
            >五目<span class="brand-small">DOJO / 伍</span></span
          ></a
        >
        <nav aria-label="モード">
          <button data-mode="play" class="nav active">
            <span class="nav-icon">✣</span
            ><span>対局<small>PLAY</small></span></button
          ><button data-mode="learn" class="nav">
            <span class="nav-icon">◈</span
            ><span>型を学ぶ<small>LEARN</small></span></button
          ><button data-mode="drill" class="nav">
            <span class="nav-icon">◎</span
            ><span>反復練習<small>TRAIN</small></span></button
          ><button data-mode="review" class="nav">
            <span class="nav-icon">↶</span
            ><span>棋譜検討<small>REVIEW</small></span></button
          ><button data-mode="stats" class="nav">
            <span class="nav-icon">▥</span
            ><span>戦績<small>RECORDS</small></span>
          </button>
        </nav>
        <div class="rail-bottom">
          <span class="tiny-stone black"></span><span>黒から、勝ち切る。</span>
        </div>
      </aside>
      <main>
        <header class="topbar">
          <div class="breadcrumb">
            <svg class="ui-icon" aria-hidden="true">
              <use href="assets/ui-icons.svg#board" /></svg
            >VS ソカン <b id="mode-label">対局</b>
          </div>
          <div class="top-actions">
            <button
              data-action="new"
              class="icon-button new-top-button"
              aria-label="新しい対局"
            >
              <svg class="ui-icon" aria-hidden="true">
                <use href="assets/ui-icons.svg#plus" /></svg
              ><span>新規</span></button
            ><button
              id="sound"
              class="icon-button"
              title="効果音"
              aria-label="効果音を切り替える"
            ></button
            ><button id="about" class="icon-button" aria-label="設定とルール">
              <svg class="ui-icon" aria-hidden="true">
                <use href="assets/ui-icons.svg#settings" />
              </svg>
            </button>
          </div>
        </header>
        <section class="headline">
          <div>
            <div class="eyebrow"><span></span> THE FIVE STONE PROJECT</div>
            <h1 id="page-title">その一手で、<em>仕留めろ。</em></h1>
          </div>
          <div class="headline-mark" aria-hidden="true">
            伍<span>FIVE IN A ROW</span>
          </div>
        </section>
        <div id="context-bar" class="context-bar"></div>
        <div id="arena" class="arena">
          <section class="board-column">
            <div class="match-strip">
              <div class="player">
                <div class="stone-avatar black"></div>
                <div>
                  <span class="player-label">あなた</span
                  ><strong>黒 <small>先手</small></strong>
                </div>
              </div>
              <span class="vs">VS</span>
              <div class="player rival">
                <div>
                  <span class="player-label" id="opponent-name"
                    >CPU / RAPFI</span
                  ><strong id="opponent-label">白 <small>後手</small></strong>
                </div>
                <img src="assets/cpu.svg" alt="CPU" />
              </div>
            </div>
            <div class="board-frame">
              <div class="corner top-left"></div>
              <div class="corner bottom-right"></div>
              <div
                id="board"
                class="board"
                role="grid"
                aria-label="15×15の五目盤"
                aria-rowcount="15"
                aria-colcount="15"
              >
                <svg
                  id="board-lines"
                  viewBox="0 0 640 640"
                  aria-hidden="true"
                ></svg>
                <div id="intersections" class="intersections"></div>
                <svg
                  id="board-overlay"
                  viewBox="0 0 640 640"
                  aria-hidden="true"
                ></svg>
              </div>
            </div>
            <div class="board-status">
              <span id="turn-status" role="status"
                ><i class="status-dot"></i> あなたの番</span
              >
              <div>
                <span id="move-count">000</span><small>手</small
                ><button id="numbers" class="text-button" aria-pressed="false">
                  手順番号
                </button>
              </div>
            </div>
            <div id="board-controls" class="board-controls"></div>
          </section>
          <aside id="panel" class="panel"></aside>
        </div>
        <section id="records-view" class="records-view" hidden></section>
        <footer>
          <span>VS ソカン <b>五目道場</b></span
          ><span>15 × 15 <i>·</i> 禁手なし <i>·</i> 五連以上で勝ち</span
          ><span class="footer-motto">一手ずつ、強く。</span>
        </footer>
      </main>
    </div>
    <dialog id="modal">
      <button class="modal-close icon-button" aria-label="閉じる">
        <svg class="ui-icon" aria-hidden="true">
          <use href="assets/ui-icons.svg#close" />
        </svg>
      </button>
      <div id="modal-body"></div>
    </dialog>
    <div id="toast" role="status"></div>
    <input
      id="import-file"
      type="file"
      accept="application/json,.json"
      hidden
    />
    <script type="module" src="app.js"></script>
  </body>
</html>
