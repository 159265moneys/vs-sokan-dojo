<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#11151c" />
    <title>VS 楚涵 | 五目並べ</title>
    <meta
      name="description"
      content="一手を研ぎ澄ませ。禁手なしの五目並べ、Rapfiとの対局、戦術の反復と棋譜検討。"
    />
    <link
      rel="icon"
      href="assets/branding/favicon-32.png"
      type="image/png"
      sizes="32x32"
    />
    <link
      rel="apple-touch-icon"
      href="assets/branding/apple-touch-icon.png"
      sizes="180x180"
    />
    <meta name="apple-mobile-web-app-title" content="VS 楚涵" />
    <link rel="stylesheet" href="game-ui.css?v=learning-rebuild-20261111" />
    <link rel="stylesheet" href="board-themes.css" />
    <link rel="stylesheet" href="rebuild-ui.css?v=learning-v3-20261112" />
    <link rel="preload" as="image" href="assets/themes/board-luxury.jpg" />
    <link rel="preload" as="image" href="assets/themes/board-inferno.jpg" />
    <link
      rel="preload"
      as="image"
      href="assets/themes/stone-luxury-black.png"
    />
    <link
      rel="preload"
      as="image"
      href="assets/themes/stone-luxury-white.png"
    />
    <link rel="preload" as="image" href="assets/themes/stone-inferno-red.png" />
    <link
      rel="preload"
      as="image"
      href="assets/themes/stone-inferno-blue.png"
    />
  </head>
  <body class="mobile-game title-visible" data-mode="play">
    <section
      id="title-screen"
      class="title-screen"
      aria-label="VS 楚涵 タイトル画面"
    >
      <div class="title-art">
        <img
          class="title-emblem"
          src="assets/branding/emblem-source.png"
          alt="五目並べの黒石と白石"
          width="160"
          height="160"
        />
        <h1>
          <img
            src="assets/branding/title.png"
            alt="VS 楚涵"
            width="600"
            height="200"
          />
        </h1>
      </div>
      <div class="title-bottom">
        <div class="loading-status">
          <span class="loading-indicator" aria-hidden="true"></span
          ><span id="loading-label" class="sr-only" role="status"
            >読み込み中</span
          ><span id="loading-percent">0%</span>
        </div>
        <div
          id="loading-progress"
          class="loading-track"
          role="progressbar"
          aria-label="読み込み"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <span id="loading-fill"></span>
        </div>
        <button
          id="title-start"
          class="primary"
          data-action="title-start"
          disabled
        >
          対局する</button
        ><button id="title-retry" class="secondary" data-action="retry" hidden>
          再読み込み</button
        ><button class="title-learn" data-action="title-learn">学ぶ</button>
      </div>
    </section>
    <div class="shell" inert aria-hidden="true">
      <aside class="rail">
        <a href="#play" class="brand" aria-label="五目道場 ホーム"
          ><img src="assets/crest.svg" alt="" /><span
            >五目<span class="brand-small">DOJO / 伍</span></span
          ></a
        >
        <nav aria-label="モード">
          <button data-mode="learn" class="nav">
            <span class="nav-icon"
              ><svg class="ui-icon" aria-hidden="true">
                <use href="assets/ui-icons.svg#learn" /></svg></span
            ><span>学ぶ</span>
          </button>
          <button data-mode="play" class="nav">
            <span class="nav-icon"
              ><svg class="ui-icon" aria-hidden="true">
                <use href="assets/ui-icons.svg#board" /></svg></span
            ><span>対局</span>
          </button>
          <button data-mode="review" class="nav">
            <span class="nav-icon"
              ><svg class="ui-icon" aria-hidden="true">
                <use href="assets/ui-icons.svg#review" /></svg></span
            ><span>振り返り</span>
          </button>
        </nav>
        <div class="rail-bottom">
          <span class="tiny-stone black"></span><span>黒から、勝ち切る。</span>
        </div>
      </aside>
      <main>
        <header class="topbar">
          <div class="game-brand" aria-label="VS 楚涵">
            <img
              class="game-emblem"
              src="assets/branding/emblem.png"
              alt=""
              width="36"
              height="36"
            />
            <img
              class="game-wordmark"
              src="assets/branding/title.png"
              alt="VS 楚涵"
              width="150"
              height="50"
            />
            <b id="mode-label" class="sr-only">対局</b>
          </div>
          <div class="top-actions">
            <button
              data-action="new"
              class="icon-button new-top-button"
              aria-label="新しい対局"
            >
              <svg class="ui-icon" aria-hidden="true">
                <use href="assets/ui-icons.svg#plus" /></svg
              ><span>新規</span></button
            ><button
              id="sound"
              class="icon-button"
              title="効果音"
              aria-label="効果音を切り替える"
            ></button
            ><button id="about" class="icon-button" aria-label="設定とルール">
              <svg class="ui-icon" aria-hidden="true">
                <use href="assets/ui-icons.svg#settings" />
              </svg>
            </button>
          </div>
        </header>
        <section class="headline">
          <div>
            <div class="eyebrow"><span></span> THE FIVE STONE PROJECT</div>
            <h1 id="page-title">その一手で、<em>仕留めろ。</em></h1>
          </div>
          <div class="headline-mark" aria-hidden="true">
            伍<span>FIVE IN A ROW</span>
          </div>
        </section>
        <div id="context-bar" class="context-bar"></div>
        <div id="arena" class="arena">
          <section class="board-column">
            <div class="match-strip">
              <div class="board-status">
                <span id="turn-status" role="status"
                  ><i class="status-dot"></i> あなたの番</span
                >
                <div>
                  <span id="move-count">000</span><small>手</small
                  ><button
                    id="numbers"
                    class="text-button"
                    aria-pressed="false"
                  >
                    手順番号
                  </button>
                </div>
              </div>

              <div class="player">
                <div class="stone-avatar black"></div>
                <div>
                  <span class="player-label">あなた</span><strong>黒</strong>
                </div>
              </div>
              <span class="vs">VS</span>
              <div class="player rival">
                <div>
                  <span class="player-label" id="opponent-name"
                    >CPU / RAPFI</span
                  ><strong id="opponent-label">白 <small>後手</small></strong>
                </div>
                <img src="assets/cpu.svg" alt="CPU" />
              </div>
            </div>
            <div class="board-frame">
              <div class="corner top-left"></div>
              <div class="corner bottom-right"></div>
              <div
                id="board"
                class="board"
                role="grid"
                aria-label="15×15の五目盤"
                aria-rowcount="15"
                aria-colcount="15"
              >
                <svg
                  id="board-lines"
                  viewBox="0 0 640 640"
                  aria-hidden="true"
                ></svg>
                <div
                  id="intersections"
                  class="intersections"
                  role="rowgroup"
                ></div>
                <svg
                  id="board-overlay"
                  viewBox="0 0 640 640"
                  aria-hidden="true"
                ></svg>
              </div>
            </div>
            <div id="board-controls" class="board-controls"></div>
          </section>
          <aside id="panel" class="panel"></aside>
        </div>
        <section id="library-view" class="library-view" hidden></section>
        <footer>
          <span>VS 楚涵 <b>五目道場</b></span
          ><span>15 × 15 <i>·</i> 禁手なし <i>·</i> 五連以上で勝ち</span
          ><span class="footer-motto">一手ずつ、強く。</span>
        </footer>
      </main>
    </div>
    <dialog id="modal" aria-label="操作ダイアログ">
      <button class="modal-close icon-button" aria-label="閉じる">
        <svg class="ui-icon" aria-hidden="true">
          <use href="assets/ui-icons.svg#close" />
        </svg>
      </button>
      <div id="modal-body"></div>
    </dialog>
    <div id="toast" role="status"></div>
    <input
      id="import-file"
      type="file"
      accept="application/json,.json"
      hidden
    />
    <script type="module" src="app.js?v=learning-v3-20261111"></script>
  </body>
</html>
